<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ album.title }}</title>

    <!-- PhotoSwipe CSS (ОБЯЗАТЕЛЬНО) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/photoswipe/5.3.8/photoswipe.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/photoswipe/5.3.8/photoswipe-ui-default.min.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .gallery-item {
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 1;
            transition: transform 0.3s;
        }
        .gallery-item:hover {
            transform: scale(1.03);
        }
        .gallery-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            cursor: zoom-in;
        }
        .empty-album {
            text-align: center;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <h1>{{ album.title }}</h1> <pre>Debug: {{ photos|length }} photos</pre>
    {% if album.description %}<p>{{ album.description }}</p>{% endif %}

    {% if photos %}
    <div class="gallery" id="gallery">
        {% for photo in photos %}
        <a href="{{ photo.url }}"
           data-pswp-width="{{ photo.width }}"
           data-pswp-height="{{ photo.height }}"
           {% if photo.description %}data-pswp-caption="{{ photo.description }}"{% endif %}
           class="gallery-item">
            <img src="{{ photo.thumb_url }}"
                 alt="{{ photo.description|default:'' }}"
                 class="gallery-img">
        </a>
        {% endfor %}
    </div>
    {% else %}
    <div class="empty-album">В альбоме пока нет фотографий</div>
    {% endif %}

    <!-- PhotoSwipe JS (ПОРЯДОК ВАЖЕН!) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/photoswipe/5.3.8/photoswipe.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/photoswipe/5.3.8/photoswipe-lightbox.min.js"></script>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const lightbox = new PhotoSwipeLightbox({
            gallery: '#gallery',
            children: 'a',
            pswpModule: PhotoSwipe,
            arrowPrev: true,
            arrowNext: true,
            zoom: true
        });
        lightbox.init();
    });
    </script>
</body>
</html>
