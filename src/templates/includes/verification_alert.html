{% if user.is_authenticated %}
    <div id="verify-message"
         style="display: none; background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba;
                padding: 12px; border-radius: 6px; margin: 10px 0; text-align: center;">
        Please verify your email address to access all features.
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const isEmailVerified = {{ is_email_verified|yesno:"true,false" }};

            if (!isEmailVerified) {
                const message = document.getElementById("verify-message");
                message.style.display = "block";

                setTimeout(() => {
                    message.style.transition = "opacity 0.5s ease-out";
                    message.style.opacity = "0";
                    setTimeout(() => message.style.display = "none", 500);
                }, 5000);
            }
        });
    </script>
{% endif %}
