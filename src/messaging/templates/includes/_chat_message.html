<li class="d-flex {% if message.author == user %}justify-content-end{% else %}justify-content-start{% endif %}">
  <div class="message-wrapper position-relative p-2 rounded-3"
       style="
         max-width: 65%;
         background-color: {% if message.author == user %}#0d6efd{% else %}#343a40{% endif %};
         color: white;
       ">
    <div class="d-flex align-items-center mb-1 gap-2" style="font-size: 0.85rem; opacity: 0.8;">
      <img src="{{ message.author.profile.avatar|default:'/static/img/no_avatar.png' }}" alt="{{ message.author.username }}"
           class="rounded-circle" width="28" height="28" style="object-fit: cover;">
      <strong>{{ message.author.username }}</strong>
      <small class="ms-auto text-nowrap">{{ message.created_at|date:"H:i" }}</small>
    </div>
    <p class="mb-0">{{ message.body }}</p>
  </div>
</li>

<style>
/* Общий стиль пузыря */
.message-wrapper {
  padding: 10px 14px;
  border-radius: 18px;
  max-width: 65%;
  position: relative;
  margin-bottom: 12px;
  font-size: 15px;
  line-height: 1.4;
  color: #fff;
}

/* Сообщение от текущего пользователя (справа) */
li.justify-content-end .message-wrapper {
  background: #0d6efd;
  margin-left: auto;
  border-bottom-right-radius: 4px;
}

/* Сообщение от другого пользователя (слева) */
li.justify-content-start .message-wrapper {
  background: #495057;
  margin-right: auto;
  border-bottom-left-radius: 4px;
}

/* Хвостик справа */
li.justify-content-end .message-wrapper::after {
  content: "";
  position: absolute;
  right: -8px;
  bottom: 0;
  width: 0;
  height: 0;
  border: 10px solid transparent;
  border-top-color: #0d6efd;
  border-bottom: 0;
  border-right: 0;
  margin-bottom: -1px;
}

/* Хвостик слева */
li.justify-content-start .message-wrapper::after {
  content: "";
  position: absolute;
  left: -8px;
  bottom: 0;
  width: 0;
  height: 0;
  border: 10px solid transparent;
  border-top-color: #495057;
  border-bottom: 0;
  border-left: 0;
  margin-bottom: -1px;
}
</style>
