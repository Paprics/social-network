{% extends "base.html" %}

{% block main %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="alert alert-info text-center" style="max-width: 400px; width: 100%;">
        <h4 class="alert-heading">Account Successfully Deleted</h4>
        <p>Your account has been deleted. You will be redirected to the homepage in <span id="countdown">5</span>
            seconds.</p>
    </div>
</div>

<script>
    let countdown = 5;
    const countdownEl = document.getElementById('countdown');
    const interval = setInterval(() => {
        countdown--;
        if (countdown <= 0) {
            clearInterval(interval);
            window.location.href = '/';  // редирект на главную
        } else {
            countdownEl.textContent = countdown;
        }
    }, 1000);
</script>
{% endblock %}
