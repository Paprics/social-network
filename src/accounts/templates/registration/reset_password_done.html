{% extends 'base.html' %}

{% block main %}
    <div class="container mt-5 text-center">
        <h2 class="mb-3">Check your email</h2>
        <p class="lead">A password reset link has been sent to your email address.</p>
        <p>You will be redirected to the homepage in <span id="countdown">5</span> seconds.</p>

        <div class="mt-4">
            <a href="/" class="btn btn-outline-primary">Go to homepage now</a>
        </div>
    </div>

    <script>
        let seconds = 5;
        const countdownElem = document.getElementById('countdown');

        const countdown = setInterval(() => {
            seconds--;
            countdownElem.textContent = seconds;
            if (seconds <= 0) {
                clearInterval(countdown);
                window.location.href = "/";
            }
        }, 1000);
    </script>
{% endblock %}
